apply plugin: 'com.android.application'

configurations.all {
    resolutionStrategy.force 'androidx.activity:activity:1.7.2'
}

android {
    namespace 'com.google.codelabs.mdc.java.shrine'
    compileSdk 36

    defaultConfig {
        applicationId "com.google.codelabs.mdc.java.shrine"
        minSdkVersion 29
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.activity:activity:1.7.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Some IDE/import flows mistakenly invoke :app:wrapper instead of the root :wrapper task.
tasks.register("wrapper") {
    group = "build setup"
    description = "Delegates to the root wrapper task for compatibility with module-scoped invocations."
    dependsOn gradle.rootProject.tasks.named("wrapper")
}

// Some IDE/Gradle integrations probe this Kotlin task even in pure-Java Android modules.
tasks.register("prepareKotlinBuildScriptModel") {
    group = "ide"
    description = "No-op compatibility task for IDE sync on modules without the Kotlin plugin."
}
